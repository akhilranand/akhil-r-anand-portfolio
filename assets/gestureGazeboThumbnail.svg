  <path d="M250 315c-27-36-35-72-15-86 21-14 40 22 58 45l-1-110c0-25 34-28 37-2l8 79 3-99c1-26 36-26 37 1l2 95 8-76c3-25 36-21 36 5l-1 93 13-57c6-25 39-16 34 10l-18 105c-12 69-54 106-114 103-45-2-65-43-87-106z"
