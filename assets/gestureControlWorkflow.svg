<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Gesture-controlled TurtleSim workflow</title>
  <desc id="desc">Webcam hand gestures are detected with OpenCV and MediaPipe, converted to ROS 2 velocity commands, and used to control TurtleSim.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11242e"/>
      <stop offset="1" stop-color="#07131c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163441"/>
      <stop offset="1" stop-color="#0b1c25"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10z" fill="#67e8f9"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#67e8f9" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1000" height="420" rx="24" fill="url(#background)"/>
  <rect width="1000" height="420" rx="24" fill="url(#grid)"/>
  <text x="54" y="58" fill="#edf7ff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Gesture-Controlled TurtleSim Pipeline</text>
  <text x="54" y="88" fill="#aac4d4" font-family="JetBrains Mono,monospace" font-size="14">COMPUTER VISION · ROS 2 · TURTLESIM</text>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="190" height="150" rx="16" fill="url(#panel)" stroke="#67e8f9" stroke-opacity=".45"/>
    <rect x="112" y="170" width="76" height="50" rx="8" fill="#67e8f9" fill-opacity=".1" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="150" cy="195" r="13" fill="none" stroke="#67e8f9" stroke-width="3"/>
    <path d="M124 230h52" stroke="#67e8f9" stroke-width="3"/>
    <text x="150" y="260" fill="#edf7ff" font-size="18" font-weight="600">Webcam</text>
    <text x="150" y="282" fill="#aac4d4" font-size="13">Live video input</text>

    <rect x="300" y="145" width="190" height="150" rx="16" fill="url(#panel)" stroke="#67e8f9" stroke-opacity=".45"/>
    <path d="M378 210c-8-12-10-25-3-29 7-4 12 9 15 16v-28c0-9 12-9 12 0v23-18c0-9 12-9 12 0v19-14c0-9 12-9 12 0v26c0 21-12 34-31 34-12 0-20-10-25-19l-9-16c-5-9 5-15 17-2z" fill="#67e8f9" fill-opacity=".12" stroke="#67e8f9" stroke-width="2"/>
    <text x="395" y="260" fill="#edf7ff" font-size="18" font-weight="600">OpenCV + MediaPipe</text>
    <text x="395" y="282" fill="#aac4d4" font-size="13">Hand tracking and gestures</text>

    <rect x="545" y="145" width="190" height="150" rx="16" fill="url(#panel)" stroke="#67e8f9" stroke-opacity=".45"/>
    <path d="M605 181h70v40h-70z" fill="#67e8f9" fill-opacity=".1" stroke="#67e8f9" stroke-width="2"/>
    <path d="M615 193h50M615 203h35M615 213h42" stroke="#67e8f9" stroke-width="2"/>
    <text x="640" y="260" fill="#edf7ff" font-size="18" font-weight="600">ROS 2 Node</text>
    <text x="640" y="282" fill="#aac4d4" font-size="13">Publishes Twist commands</text>

    <rect x="790" y="145" width="155" height="150" rx="16" fill="url(#panel)" stroke="#67e8f9" stroke-opacity=".45"/>
    <circle cx="868" cy="197" r="30" fill="#67e8f9" fill-opacity=".1" stroke="#67e8f9" stroke-width="2"/>
    <path d="M868 175l-10 20 10 5 10-5z" fill="#67e8f9"/>
    <circle cx="860" cy="202" r="3" fill="#edf7ff"/><circle cx="876" cy="202" r="3" fill="#edf7ff"/>
    <text x="868" y="260" fill="#edf7ff" font-size="18" font-weight="600">TurtleSim</text>
    <text x="868" y="282" fill="#aac4d4" font-size="13">Robot movement</text>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)">
    <path d="M250 220h38"/>
    <path d="M495 220h38"/>
    <path d="M740 220h38"/>
  </g>
</svg>
